<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <title>Konto erstellen — NettoDesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/nettodesk.js"></script>
    <script src="password-toggle.js" defer></script>
    <script src="site-logo.js"></script>
    <script src="cookie-notice.js"></script>
    <script src="translations.js"></script>
    <script src="i18n.js"></script>
</head>
<body class="bg-white text-slate-900 min-h-screen flex flex-col">
    <nav class="border-b border-slate-100">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <img class="brand-logo" src="assets/nettodesk-logo.svg" alt="NettoDesk" style="height:28px;width:auto" />
            </a>
            <div class="flex items-center gap-4">
                <div class="hidden sm:flex items-center gap-1 text-xs font-semibold">
                    <button type="button" data-lang-btn="de" class="px-1.5 py-1 rounded hover:bg-slate-100 transition">DE</button>
                    <span class="text-slate-300">|</span>
                    <button type="button" data-lang-btn="en" class="px-1.5 py-1 rounded hover:bg-slate-100 transition">EN</button>
                </div>
                <span class="text-slate-500 text-sm hidden sm:inline" data-i18n="register.haveAccount">Schon ein Konto?</span>
                <a href="login.html" class="text-brand-deep hover:text-brand-deep text-sm font-semibold transition" data-i18n="register.loginLink">Jetzt anmelden</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center p-6">
        <div class="w-full max-w-md">
            <span class="inline-block bg-brand-soft text-brand-deep text-xs font-semibold px-3 py-1.5 rounded-full mb-4" data-i18n="home.badge">Für eBay-Verkäufer gebaut</span>
            <h2 class="text-2xl font-bold mb-2" data-i18n="register.formTitle">Konto erstellen</h2>
            <p class="text-slate-500 text-sm mb-6" data-i18n="register.formSubtitle">Kostenlos starten, in unter 2 Minuten</p>

            <div id="error-box" class="hidden bg-red-50 text-red-700 border border-red-200 p-3 rounded-lg mb-4 text-center text-sm"></div>
            <div id="success-box" class="hidden bg-emerald-50 text-emerald-700 border border-emerald-200 p-3 rounded-lg mb-4 text-center text-sm"></div>

            <div id="closed-box" class="hidden bg-amber-50 text-amber-900 border border-amber-200 p-4 rounded-lg text-center text-sm">
                Die Registrierung ist derzeit geschlossen.<br>Registration is currently closed.<br>
                <a href="login.html" class="underline font-semibold">Anmelden</a>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5" data-i18n="register.companyName">Firmenname</label>
                    <input type="text" id="company_name" required class="w-full px-3 py-2.5 rounded-lg bg-white border border-slate-300 text-slate-900 focus:border-brand focus:ring-2 focus:ring-brand/20 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5" data-i18n="register.email">E-Mail</label>
                    <input type="email" id="email" required class="w-full px-3 py-2.5 rounded-lg bg-white border border-slate-300 text-slate-900 focus:border-brand focus:ring-2 focus:ring-brand/20 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5" data-i18n="register.password">Passwort</label>
                    <input type="password" id="password" required minlength="8" class="w-full px-3 py-2.5 rounded-lg bg-white border border-slate-300 text-slate-900 focus:border-brand focus:ring-2 focus:ring-brand/20 focus:outline-none transition">
                    <p class="text-xs text-slate-400 mt-1" data-i18n="register.passwordHint">Mindestens 8 Zeichen</p>
                </div>
                <div class="flex items-start gap-2">
                    <input type="checkbox" id="business_confirmed" required class="mt-0.5 h-4 w-4 rounded border-slate-300 text-brand-deep">
                    <label for="business_confirmed" class="text-xs text-slate-500 leading-relaxed" data-i18n="register.businessLabel">Ich handle als Unternehmer (§ 14 BGB), nicht als Verbraucher.</label>
                </div>
                <div class="flex items-start gap-2">
                    <input type="checkbox" id="terms_accepted" required class="mt-0.5 h-4 w-4 rounded border-slate-300 text-brand-deep">
                    <label for="terms_accepted" class="text-xs text-slate-500 leading-relaxed" data-i18n-html="register.termsLabel">Ich akzeptiere die <a href="policies.html" target="_blank" class="text-brand-deep underline">AGB</a> und den <a href="avv.html" target="_blank" class="text-brand-deep underline">Vertrag zur Auftragsverarbeitung</a>. Hinweise zum Datenschutz stehen in der <a href="privacy.html" target="_blank" class="text-brand-deep underline">Datenschutzerklärung</a>.</label>
                </div>
                <button type="submit" id="submit-btn" class="w-full inline-flex items-center justify-center gap-2 bg-brand hover:bg-brand-hover text-ink font-bold py-3 rounded-xl transition shadow-lg shadow-brand/25">
                    <span data-i18n="register.submit">Konto erstellen</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
            </form>

            <p class="text-slate-400 text-xs text-center mt-6" data-i18n="home.noCreditCard">Keine Kreditkarte nötig</p>
        </div>
    </main>

    <script>
        const API_URL = ["localhost", "127.0.0.1"].includes(location.hostname) ? location.origin : "https://express-print-saas.onrender.com";

        (async () => {
            try {
                const r = await fetch(`${API_URL}/auth/registration-status`);
                if (r.ok && !(await r.json()).open) {
                    document.getElementById("auth-form").classList.add("hidden");
                    document.getElementById("closed-box").classList.remove("hidden");
                }
            } catch (err) { /* the server refuses a closed sign-up anyway */ }
        })();

        async function handleAuth(event) {
            event.preventDefault();
            const errBox = document.getElementById("error-box");
            const succBox = document.getElementById("success-box");
            const btn = document.getElementById("submit-btn");

            errBox.classList.add("hidden");
            succBox.classList.add("hidden");
            btn.disabled = true;
            btn.innerText = t("register.submitLoading");

            const payload = {
                company_name: document.getElementById("company_name").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                plan_name: new URLSearchParams(window.location.search).get("plan") || null,
                referral_code: new URLSearchParams(window.location.search).get("ref") || null,
                business_confirmed: document.getElementById("business_confirmed").checked,
                terms_accepted: document.getElementById("terms_accepted").checked
            };

            try {
                // تجربة مسار التسجيل الأساسي
                let response = await fetch(`${API_URL}/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                // إذا كان المسار /register بدون /auth
                if (response.status === 404) {
                    response = await fetch(`${API_URL}/register`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                }

                const data = await response.json();

                if (response.ok) {
                    succBox.innerText = t("register.successMessage");
                    succBox.classList.remove("hidden");
                    localStorage.setItem("access_token", data.access_token);
                    setTimeout(() => { window.location.href = "app/dashboard.html"; }, 1000);
                } else {
                    errBox.innerText = data.detail || t("register.genericError");
                    errBox.classList.remove("hidden");
                }
            } catch (err) {
                errBox.innerText = t("register.serverError");
                errBox.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btn.innerText = t("register.submit");
            }
        }
    </script>
</body>
</html>
