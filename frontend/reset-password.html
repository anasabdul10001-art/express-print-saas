<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passwort zurücksetzen — Express Print SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen">
    <div class="bg-neutral-900 p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center">Neues Passwort festlegen</h2>

        <div id="error-box" class="hidden bg-red-600 text-white p-3 rounded mb-4 text-center text-sm"></div>
        <div id="success-box" class="hidden bg-white text-black p-3 rounded mb-4 text-center text-sm"></div>

        <form id="reset-form" onsubmit="handleReset(event)" class="space-y-4">
            <div>
                <label class="block text-sm mb-1">Neues Passwort</label>
                <input type="password" id="password" required minlength="8" autocomplete="new-password"
                       class="w-full p-2 rounded bg-neutral-800 border border-neutral-700 text-white">
            </div>
            <div>
                <label class="block text-sm mb-1">Passwort bestätigen</label>
                <input type="password" id="password-confirm" required minlength="8" autocomplete="new-password"
                       class="w-full p-2 rounded bg-neutral-800 border border-neutral-700 text-white">
            </div>
            <button type="submit" id="submit-btn"
                    class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded transition">
                Passwort speichern
            </button>
        </form>

        <p class="text-gray-400 text-sm text-center mt-6">
            <a href="login.html" class="text-red-500 hover:text-red-400 font-semibold">Zurück zur Anmeldung</a>
        </p>
    </div>

    <script>
        const API_URL = "https://express-print-saas.onrender.com";
        const token = new URLSearchParams(window.location.search).get("token");

        if (!token) {
            document.getElementById("reset-form").classList.add("hidden");
            const errBox = document.getElementById("error-box");
            errBox.innerText = "Kein gültiger Link. Bitte fordere einen neuen Reset-Link an.";
            errBox.classList.remove("hidden");
        }

        async function handleReset(event) {
            event.preventDefault();
            const errBox = document.getElementById("error-box");
            const succBox = document.getElementById("success-box");
            const btn = document.getElementById("submit-btn");

            errBox.classList.add("hidden");
            succBox.classList.add("hidden");

            const password = document.getElementById("password").value;
            const passwordConfirm = document.getElementById("password-confirm").value;

            if (password !== passwordConfirm) {
                errBox.innerText = "Die Passwörter stimmen nicht überein.";
                errBox.classList.remove("hidden");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Bitte warten...";

            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, new_password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    succBox.innerText = `${data.message} Weiterleitung...`;
                    succBox.classList.remove("hidden");
                    document.getElementById("reset-form").classList.add("hidden");
                    setTimeout(() => { window.location.href = "login.html"; }, 2000);
                } else {
                    errBox.innerText = data.detail || "Zurücksetzen fehlgeschlagen.";
                    errBox.classList.remove("hidden");
                }
            } catch (err) {
                errBox.innerText = "Server nicht erreichbar. Bitte erneut versuchen.";
                errBox.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btn.innerText = "Passwort speichern";
            }
        }
    </script>
</body>
</html>
