<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23E11D48'/%3E%3Cpath d='M9 21V11h6a4 4 0 0 1 0 8h-3' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Passwort zurücksetzen — ShipSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="site-logo.js"></script>
    <script src="translations.js"></script>
    <script src="i18n.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 flex items-center justify-center min-h-screen p-6">
    <div class="fixed top-4 right-4 flex items-center gap-1 text-xs font-semibold">
        <button type="button" data-lang-btn="de" class="px-1.5 py-1 rounded hover:bg-slate-200 transition">DE</button>
        <span class="text-slate-300">|</span>
        <button type="button" data-lang-btn="en" class="px-1.5 py-1 rounded hover:bg-slate-200 transition">EN</button>
    </div>
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 w-full max-w-md">
        <div class="flex items-center gap-2 justify-center mb-6">
            <svg class="brand-logo" width="28" height="28" viewBox="0 0 32 32" fill="none">
                <rect width="32" height="32" rx="9" fill="#E11D48"/>
                <path d="M9 21V11h6a4 4 0 0 1 0 8h-3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h2 class="text-2xl font-bold mb-6 text-center" data-i18n="reset.title">Neues Passwort festlegen</h2>

        <div id="error-box" class="hidden bg-red-50 text-red-700 border border-red-200 p-3 rounded-lg mb-4 text-center text-sm"></div>
        <div id="success-box" class="hidden bg-emerald-50 text-emerald-700 border border-emerald-200 p-3 rounded-lg mb-4 text-center text-sm"></div>

        <form id="reset-form" onsubmit="handleReset(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5" data-i18n="reset.newPassword">Neues Passwort</label>
                <input type="password" id="password" required minlength="8" autocomplete="new-password"
                       class="w-full px-3 py-2.5 rounded-lg bg-white border border-slate-300 text-slate-900 focus:border-red-500 focus:ring-2 focus:ring-red-500/20 focus:outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5" data-i18n="reset.confirmPassword">Passwort bestätigen</label>
                <input type="password" id="password-confirm" required minlength="8" autocomplete="new-password"
                       class="w-full px-3 py-2.5 rounded-lg bg-white border border-slate-300 text-slate-900 focus:border-red-500 focus:ring-2 focus:ring-red-500/20 focus:outline-none transition">
            </div>
            <button type="submit" id="submit-btn"
                    class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-lg transition shadow-sm shadow-red-600/20">
                <span data-i18n="reset.submit">Passwort speichern</span>
            </button>
        </form>

        <p class="text-slate-500 text-sm text-center mt-6">
            <a href="login.html" class="text-red-600 hover:text-red-700 font-semibold" data-i18n="reset.backToLogin">Zurück zur Anmeldung</a>
        </p>
    </div>

    <script>
        const API_URL = "https://express-print-saas.onrender.com";
        const token = new URLSearchParams(window.location.search).get("token");

        if (!token) {
            document.getElementById("reset-form").classList.add("hidden");
            const errBox = document.getElementById("error-box");
            errBox.innerText = t("reset.invalidLink");
            errBox.classList.remove("hidden");
        }

        async function handleReset(event) {
            event.preventDefault();
            const errBox = document.getElementById("error-box");
            const succBox = document.getElementById("success-box");
            const btn = document.getElementById("submit-btn");

            errBox.classList.add("hidden");
            succBox.classList.add("hidden");

            const password = document.getElementById("password").value;
            const passwordConfirm = document.getElementById("password-confirm").value;

            if (password !== passwordConfirm) {
                errBox.innerText = t("reset.mismatch");
                errBox.classList.remove("hidden");
                return;
            }

            btn.disabled = true;
            btn.innerText = t("reset.submitLoading");

            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, new_password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    succBox.innerText = `${data.message} ${t("reset.redirecting")}`;
                    succBox.classList.remove("hidden");
                    document.getElementById("reset-form").classList.add("hidden");
                    setTimeout(() => { window.location.href = "login.html"; }, 2000);
                } else {
                    errBox.innerText = data.detail || t("reset.genericError");
                    errBox.classList.remove("hidden");
                }
            } catch (err) {
                errBox.innerText = t("reset.serverError");
                errBox.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btn.innerText = t("reset.submit");
            }
        }
    </script>
</body>
</html>
