<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preise — Express Print</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-slate-900 min-h-screen">

    <!-- Nav -->
    <nav class="border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
                    <rect width="32" height="32" rx="9" fill="#E11D48"/>
                    <path d="M9 21V11h6a4 4 0 0 1 0 8h-3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="text-lg font-bold">Express Print</span>
            </a>
            <div class="flex items-center gap-3">
                <a href="login.html" class="text-slate-600 hover:text-slate-900 text-sm font-medium px-3 py-2">Anmelden</a>
                <a href="index.html" class="bg-red-600 hover:bg-red-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">Kostenlos starten</a>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <div class="max-w-3xl mx-auto px-6 pt-16 pb-10 text-center">
        <h1 class="text-4xl font-bold mb-4">Einfache, faire Preise</h1>
        <p class="text-slate-500 text-lg">Wähle den Plan, der zu deinem eBay-Geschäft passt. Jederzeit kündbar.</p>
    </div>

    <!-- Plans -->
    <div class="max-w-6xl mx-auto px-6 pb-24">
        <div id="loading" class="text-center text-slate-400 py-16">Preise werden geladen...</div>
        <div id="error-box" class="hidden max-w-md mx-auto bg-red-50 text-red-700 border border-red-200 p-4 rounded-lg text-center text-sm"></div>
        <div id="plans-grid" class="hidden grid gap-6 md:grid-cols-2 lg:grid-cols-3 items-stretch"></div>
    </div>

    <!-- Contact strip -->
    <div class="border-t border-slate-200 bg-slate-50">
        <div class="max-w-3xl mx-auto px-6 py-12 text-center">
            <h2 class="text-xl font-bold mb-2">Nicht sicher, welcher Plan passt?</h2>
            <p class="text-slate-500 mb-5">Schreib uns, wir beraten dich gerne unverbindlich.</p>
            <a href="mailto:anasabdulazizde@gmail.com" class="inline-block bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition">Kontakt aufnehmen</a>
        </div>
    </div>

    <footer id="site-footer"></footer>

    <script src="js/site.js"></script>
    <script>
        const API_URL = "https://express-print-saas.onrender.com";

        function planCardHtml(plan) {
            const price = plan.price_monthly !== null && plan.price_monthly !== undefined
                ? `<span class="text-4xl font-bold">${Number(plan.price_monthly).toFixed(2)}</span><span class="text-slate-400 font-medium"> ${plan.currency} / Monat</span>`
                : `<span class="text-3xl font-bold">Auf Anfrage</span>`;

            const limits = [];
            if (plan.order_limit !== null && plan.order_limit !== undefined) limits.push(`${plan.order_limit} Bestellungen / Monat`);
            if (plan.printer_limit !== null && plan.printer_limit !== undefined) limits.push(`${plan.printer_limit} Drucker`);
            if (plan.user_limit !== null && plan.user_limit !== undefined) limits.push(`${plan.user_limit} Benutzer`);

            const featureItems = [...limits, ...(plan.features || [])].map(f => `
                <li class="flex items-start gap-2 text-sm text-slate-600">
                    <svg class="w-5 h-5 flex-shrink-0 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                    <span>${f}</span>
                </li>
            `).join("");

            const highlight = plan.is_recommended;

            return `
                <div class="relative rounded-2xl p-8 flex flex-col ${highlight ? 'bg-slate-950 text-white shadow-xl shadow-slate-900/20 border-2 border-red-500' : 'bg-white border border-slate-200'}">
                    ${highlight ? '<span class="absolute -top-3 left-1/2 -translate-x-1/2 bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full">Beliebteste Wahl</span>' : ''}
                    <h3 class="text-lg font-bold mb-1 ${highlight ? 'text-white' : 'text-slate-900'}">${plan.name}</h3>
                    <p class="text-sm mb-5 ${highlight ? 'text-slate-400' : 'text-slate-500'}">${plan.description || ''}</p>
                    <div class="mb-6 ${highlight ? 'text-white' : 'text-slate-900'}">${price}</div>
                    <ul class="space-y-3 mb-8 flex-1 ${highlight ? '[&_svg]:text-red-400 [&_span]:text-slate-200' : ''}">
                        ${featureItems}
                    </ul>
                    <a href="index.html" class="block text-center font-semibold py-2.5 rounded-lg transition ${highlight ? 'bg-red-600 hover:bg-red-700 text-white' : 'bg-slate-900 hover:bg-slate-800 text-white'}">
                        Jetzt starten
                    </a>
                </div>
            `;
        }

        async function loadPlans() {
            const loading = document.getElementById("loading");
            const errorBox = document.getElementById("error-box");
            const grid = document.getElementById("plans-grid");

            try {
                const response = await fetch(`${API_URL}/plans`);
                if (!response.ok) throw new Error("request failed");
                const plans = await response.json();

                loading.classList.add("hidden");

                if (!plans.length) {
                    errorBox.innerText = "Aktuell sind keine Preispläne verfügbar. Bitte kontaktiere uns.";
                    errorBox.classList.remove("hidden");
                    return;
                }

                grid.innerHTML = plans.map(planCardHtml).join("");
                grid.classList.remove("hidden");
            } catch (err) {
                loading.classList.add("hidden");
                errorBox.innerText = "Preise konnten nicht geladen werden. Bitte 30s warten und Seite neu laden (Render Free Tier).";
                errorBox.classList.remove("hidden");
            }
        }

        loadPlans();
    </script>
</body>
</html>
