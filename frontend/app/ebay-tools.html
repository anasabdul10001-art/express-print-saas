<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eBay-Zentrale — NettoDesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/nettodesk.js"></script>
    <script src="trial-guard.js"></script>
    <script src="layout.js"></script>
    <script src="../list-numbers.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
<main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">eBay-Zentrale</h1>
        <a href="dashboard.html" class="text-sm text-slate-500 hover:text-brand-deep">← Dashboard</a>
    </div>
    <div id="banner" class="hidden p-3 rounded text-sm"></div>

    <nav class="flex flex-wrap gap-2 text-sm font-semibold">
        <button data-tab="messages" class="tab px-3 py-2 rounded bg-brand text-ink">Nachrichten</button>
        <button data-tab="cases" class="tab px-3 py-2 rounded bg-white border border-slate-300">Rückgaben &amp; Streitfälle</button>
        <button data-tab="traffic" class="tab px-3 py-2 rounded bg-white border border-slate-300">Statistik</button>
        <button data-tab="policies" class="tab px-3 py-2 rounded bg-white border border-slate-300">Versandrichtlinien</button>
        <button data-tab="offers" class="tab px-3 py-2 rounded bg-white border border-slate-300">Angebote an Interessenten</button>
    </nav>

    <section id="panel" class="space-y-3"></section>
</main>

<script>
const API_URL = ["localhost", "127.0.0.1"].includes(location.hostname) ? location.origin : "https://express-print-saas.onrender.com";
const token = localStorage.getItem("access_token");
if (!token) window.location.href = "../login.html";
const H = { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" };
const panel = document.getElementById("panel");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function banner(text, isError) {
    const b = document.getElementById("banner");
    b.className = "p-3 rounded text-sm " + (isError ? "bg-red-100 text-red-800" : "bg-emerald-100 text-emerald-800");
    b.innerText = text;
}
function errorsBox(errors) {
    return errors && errors.length ? `<div class="p-3 rounded bg-amber-50 text-amber-900 text-xs">${errors.map(esc).join("<br>")}</div>` : "";
}
async function api(path, options) {
    const r = await fetch(API_URL + path, { headers: H, ...options });
    if (r.status === 401) { window.location.href = "../login.html"; throw new Error("login"); }
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Fehler");
    return data;
}

const numbered = html => `<div data-numbered="list" class="space-y-3">${html}</div>`;
let MESSAGES = [];
async function showMessages() {
    const data = await api("/ebay/messages");
    MESSAGES = data.items;
    panel.innerHTML = errorsBox(data.errors) + (data.items.length ? numbered(data.items.map((m, i) => `
        <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-2">
            <div class="flex justify-between text-sm"><span class="font-semibold">${esc(m.sender)} <span class="text-slate-400 font-normal">· ${esc(m.account)}</span></span><span class="text-slate-400">${esc((m.date || "").slice(0, 10))}</span></div>
            <div class="text-sm font-semibold">${esc(m.subject)}</div>
            ${m.text ? `<div class="text-sm text-slate-700 whitespace-pre-wrap">${esc(m.text)}</div>` : `<p class="text-xs text-slate-400">Kein Nachrichtentext erkannt (z. B. eine Mitteilung von eBay). Bitte bei eBay ansehen.</p>`}
            ${data.ai_configured ? `<label class="block text-xs text-slate-500">Text für die KI – nur die Frage stehen lassen, Namen und persönliche Angaben löschen:
                <textarea id="ask-${i}" maxlength="2000" rows="3" class="mt-1 w-full border border-slate-300 rounded p-2 text-sm text-slate-800">${esc(m.text || "")}</textarea></label>
            <button onclick="suggest(${i})" class="text-sm bg-slate-900 text-white font-semibold px-3 py-1.5 rounded">KI-Antwort vorschlagen</button>` : `<p class="text-xs text-slate-400">KI-Antwortvorschläge sind nicht eingeschaltet (AI_REPLY_ENABLED und GROQ_API_KEY oder OPENROUTER_API_KEY in Render).</p>`}
            <div id="reply-${i}"></div>
        </div>`).join("")) : "<p class='text-slate-500'>Keine Nachrichten.</p>");
}
async function suggest(i) {
    const m = MESSAGES[i], box = document.getElementById("reply-" + i);
    const message = document.getElementById("ask-" + i).value.trim();
    if (!message) { box.innerHTML = "<p class='text-xs text-red-600'>Bitte zuerst den Text der Frage einfügen.</p>"; return; }
    box.innerHTML = "<p class='text-xs text-slate-400'>Erstelle Vorschlag…</p>";
    try {
        const d = await api("/ebay/suggest-reply", { method: "POST", body: JSON.stringify({ message, buyer_name: m.sender }) });
        box.innerHTML = `<p class="text-xs text-slate-500 whitespace-pre-wrap">An die KI gesendet: ${esc(d.sent_text)}</p>
            ${d.reply.includes("[BITTE") ? `<p class="text-xs font-semibold text-amber-700">Bitte die markierten Stellen [BITTE ERGÄNZEN …] vor dem Senden ausfüllen.</p>` : ""}
            <textarea class="w-full border border-slate-300 rounded p-2 text-sm" rows="6">${esc(d.reply)}</textarea>
            <p class="text-xs text-slate-400">Vorschlag von ${esc(d.provider)} – prüfen, kopieren und in eBay senden. Es wird nichts automatisch gesendet.</p>`;
    } catch (e) { box.innerHTML = `<p class="text-xs text-red-600">${esc(e.message)}</p>`; }
}

async function showCases() {
    const d = await api("/ebay/cases");
    const label = { return: "Rückgabe", cancellation: "Stornierung", inquiry: "Anfrage", dispute: "Zahlungsstreit" };
    panel.innerHTML = errorsBox(d.errors) + (d.items.length ? numbered(d.items.map(c => `
        <div class="bg-white border border-slate-200 rounded-xl p-3 text-sm flex justify-between gap-3">
            <span><b>${label[c.type]}</b> · ${esc(c.buyer)} · ${esc(c.detail)}</span>
            <span class="text-slate-500">${esc(c.status)} · ${esc((c.date || "").slice(0, 10))}</span>
        </div>`).join("")) : "<p class='text-slate-500'>Keine offenen Fälle.</p>");
}

async function showTraffic() {
    const d = await api("/ebay/traffic?days=30");
    panel.innerHTML = errorsBox(d.errors) + d.accounts.map(a => `
        <div class="bg-white border border-slate-200 rounded-xl p-3 overflow-x-auto">
            <h3 class="font-bold mb-2">${esc(a.account)} – letzte 30 Tage</h3>
            <table data-numbered="table" class="w-full text-sm"><tr class="text-left text-slate-500"><th>Artikelnr.</th><th>Aufrufe</th><th>Verkäufe</th><th>Konversion</th></tr>
            ${a.listings.map(r => `<tr class="border-t"><td>${esc(r.item_id)}</td><td>${esc(r.views)}</td><td>${esc(r.sales)}</td><td>${esc(r.conversion)}</td></tr>`).join("")}</table>
        </div>`).join("");
}

async function showPolicies() {
    const d = await api("/ebay/shipping-policies");
    panel.innerHTML = errorsBox(d.errors) + d.accounts.map(a => `
        <div data-numbered="list" class="bg-white border border-slate-200 rounded-xl p-3 text-sm space-y-2">
            <h3 class="font-bold no-number">${esc(a.account)}</h3>
            ${a.policies.map(p => `<div><b>${esc(p.name)}</b> · Bearbeitung ${esc(p.handling_days)} Tag(e)<br>
                ${p.services.map(s => `${esc(s.service)} – ${s.free ? "kostenlos" : esc(s.cost) + " €"}`).join("<br>")}</div>`).join("")}
        </div>`).join("");
}

let OFFERS = [], LIMITS = { min: 5, max: 50 };
const euro = v => v === null ? "—" : Number(v).toFixed(2).replace(".", ",") + " €";
async function showOffers() {
    const d = await api("/ebay/offers/eligible");
    OFFERS = d.items;
    LIMITS = { min: d.min_discount, max: d.max_discount };
    const intro = `<p class="text-sm text-slate-500">Artikel, für die eBay Interessenten meldet. Ein Angebot geht erst nach deiner Bestätigung raus, kann hier nicht zurückgenommen werden und gilt 2 Tage. Die Gewinnschwelle ist eine Schätzung.</p>`;
    panel.innerHTML = errorsBox(d.errors) + intro + (OFFERS.length ? numbered(OFFERS.map((o, i) => `
        <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-2 text-sm">
            <div class="font-semibold">${esc(o.title || "Artikel " + o.listing_id)}</div>
            <div class="text-slate-500"><a class="underline" target="_blank" rel="noopener" href="https://www.ebay.de/itm/${encodeURIComponent(o.listing_id)}">${esc(o.listing_id)}</a> · ${esc(o.account)} · Preis ${euro(o.price)} · Gewinnschwelle ca. ${euro(o.break_even)}</div>
            <div class="flex flex-wrap items-center gap-2">
                <label>Rabatt <input id="pct-${i}" type="number" min="${LIMITS.min}" max="${LIMITS.max}" value="${LIMITS.min}" class="w-20 p-1 border border-slate-300 rounded"> %</label>
                <input id="msg-${i}" maxlength="2000" placeholder="Nachricht (optional)" class="flex-1 min-w-[12rem] p-1 border border-slate-300 rounded">
                <button onclick="sendOffer(${i}, this)" class="bg-slate-900 text-white font-semibold px-3 py-1.5 rounded">Angebot senden…</button>
            </div>
        </div>`).join("")) : "<p class='text-slate-500'>Zurzeit meldet eBay keine Artikel mit Interessenten.</p>");
}
async function postOffer(body) {
    const r = await fetch(API_URL + "/ebay/offers/send", { method: "POST", headers: H, body: JSON.stringify(body) });
    return { status: r.status, data: await r.json().catch(() => ({})) };
}
async function sendOffer(i, button) {
    const o = OFFERS[i], percent = Number(document.getElementById("pct-" + i).value);
    if (!Number.isInteger(percent) || percent < LIMITS.min || percent > LIMITS.max) {
        banner(`Rabatt bitte als ganze Zahl von ${LIMITS.min} bis ${LIMITS.max} %.`, true); return;
    }
    if (!confirm(`${percent} % Rabatt für „${o.title || o.listing_id}“ an alle Interessenten senden? Hier kann das nicht zurückgenommen werden.`)) return;
    button.disabled = true;
    const body = { account_id: o.account_id, listing_id: o.listing_id, discount_percent: percent, message: document.getElementById("msg-" + i).value, confirm: true };
    try {
        let result = await postOffer(body);
        if (result.status === 409 && String(result.data.detail).includes("Gewinnschwelle")) {
            if (!confirm(result.data.detail + " Trotzdem senden?")) { button.disabled = false; return; }
            result = await postOffer({ ...body, accept_loss: true });
        }
        if (result.status === 200) { banner(`Angebot gesendet an ${result.data.sent_to} Interessenten.`, false); button.innerText = "Gesendet"; return; }
        banner(typeof result.data.detail === "string" ? result.data.detail : "Senden fehlgeschlagen.", true);
    } catch (e) { banner("Keine Verbindung. Bitte bei eBay prüfen, ob das Angebot gesendet wurde.", true); }
    button.disabled = false;
}

const TABS = { messages: showMessages, cases: showCases, traffic: showTraffic, policies: showPolicies, offers: showOffers };
async function open(tab) {
    document.querySelectorAll(".tab").forEach(b => {
        const on = b.dataset.tab === tab;
        b.className = "tab px-3 py-2 rounded " + (on ? "bg-brand text-ink" : "bg-white border border-slate-300");
    });
    panel.innerHTML = "<p class='text-slate-400'>Lade…</p>";
    document.getElementById("banner").className = "hidden";
    try { await TABS[tab](); } catch (e) { panel.innerHTML = ""; banner(e.message, true); }
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => open(b.dataset.tab));
open("messages");
</script>
</body>
</html>
