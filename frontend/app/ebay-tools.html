<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eBay-Zentrale — ShipSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="trial-guard.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
<main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">eBay-Zentrale</h1>
        <a href="dashboard.html" class="text-sm text-slate-500 hover:text-red-600">← Dashboard</a>
    </div>
    <div id="banner" class="hidden p-3 rounded text-sm"></div>

    <nav class="flex flex-wrap gap-2 text-sm font-semibold">
        <button data-tab="messages" class="tab px-3 py-2 rounded bg-red-600 text-white">Nachrichten</button>
        <button data-tab="cases" class="tab px-3 py-2 rounded bg-white border border-slate-300">Rückgaben &amp; Streitfälle</button>
        <button data-tab="traffic" class="tab px-3 py-2 rounded bg-white border border-slate-300">Statistik</button>
        <button data-tab="policies" class="tab px-3 py-2 rounded bg-white border border-slate-300">Versandrichtlinien</button>
    </nav>

    <section id="panel" class="space-y-3"></section>
</main>

<script>
const API_URL = ["localhost", "127.0.0.1"].includes(location.hostname) ? location.origin : "https://express-print-saas.onrender.com";
const token = localStorage.getItem("access_token");
if (!token) window.location.href = "../login.html";
const H = { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" };
const panel = document.getElementById("panel");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function banner(text, isError) {
    const b = document.getElementById("banner");
    b.className = "p-3 rounded text-sm " + (isError ? "bg-red-100 text-red-800" : "bg-emerald-100 text-emerald-800");
    b.innerText = text;
}
function errorsBox(errors) {
    return errors && errors.length ? `<div class="p-3 rounded bg-amber-50 text-amber-900 text-xs">${errors.map(esc).join("<br>")}</div>` : "";
}
async function api(path, options) {
    const r = await fetch(API_URL + path, { headers: H, ...options });
    if (r.status === 401) { window.location.href = "../login.html"; throw new Error("login"); }
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Fehler");
    return data;
}

let MESSAGES = [];
async function showMessages() {
    const data = await api("/ebay/messages");
    MESSAGES = data.items;
    panel.innerHTML = errorsBox(data.errors) + (data.items.length ? data.items.map((m, i) => `
        <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-2">
            <div class="flex justify-between text-sm"><span class="font-semibold">${esc(m.sender)} <span class="text-slate-400 font-normal">· ${esc(m.account)}</span></span><span class="text-slate-400">${esc((m.date || "").slice(0, 10))}</span></div>
            <div class="text-sm font-semibold">${esc(m.subject)}</div>
            <div class="text-sm text-slate-700 whitespace-pre-wrap">${esc(m.text)}</div>
            ${data.ai_configured ? `<button onclick="suggest(${i})" class="text-sm bg-slate-900 text-white font-semibold px-3 py-1.5 rounded">KI-Antwort vorschlagen</button>` : `<p class="text-xs text-slate-400">KI-Schlüssel fehlt (GROQ_API_KEY / GEMINI_API_KEY in Render).</p>`}
            <div id="reply-${i}"></div>
        </div>`).join("") : "<p class='text-slate-500'>Keine Nachrichten.</p>");
}
async function suggest(i) {
    const m = MESSAGES[i], box = document.getElementById("reply-" + i);
    box.innerHTML = "<p class='text-xs text-slate-400'>Erstelle Vorschlag…</p>";
    try {
        const d = await api("/ebay/suggest-reply", { method: "POST", body: JSON.stringify({ message: m.text || m.subject || "", buyer_name: m.sender }) });
        box.innerHTML = `<textarea class="w-full border border-slate-300 rounded p-2 text-sm" rows="6">${esc(d.reply)}</textarea>
            <p class="text-xs text-slate-400">Vorschlag von ${esc(d.provider)} – prüfen, kopieren und in eBay senden. Es wird nichts automatisch gesendet.</p>`;
    } catch (e) { box.innerHTML = `<p class="text-xs text-red-600">${esc(e.message)}</p>`; }
}

async function showCases() {
    const d = await api("/ebay/cases");
    const label = { return: "Rückgabe", cancellation: "Stornierung", inquiry: "Anfrage", dispute: "Zahlungsstreit" };
    panel.innerHTML = errorsBox(d.errors) + (d.items.length ? d.items.map(c => `
        <div class="bg-white border border-slate-200 rounded-xl p-3 text-sm flex justify-between gap-3">
            <span><b>${label[c.type]}</b> · ${esc(c.buyer)} · ${esc(c.detail)}</span>
            <span class="text-slate-500">${esc(c.status)} · ${esc((c.date || "").slice(0, 10))}</span>
        </div>`).join("") : "<p class='text-slate-500'>Keine offenen Fälle.</p>");
}

async function showTraffic() {
    const d = await api("/ebay/traffic?days=30");
    panel.innerHTML = errorsBox(d.errors) + d.accounts.map(a => `
        <div class="bg-white border border-slate-200 rounded-xl p-3 overflow-x-auto">
            <h3 class="font-bold mb-2">${esc(a.account)} – letzte 30 Tage</h3>
            <table class="w-full text-sm"><tr class="text-left text-slate-500"><th>Artikelnr.</th><th>Aufrufe</th><th>Verkäufe</th><th>Konversion</th></tr>
            ${a.listings.map(r => `<tr class="border-t"><td>${esc(r.item_id)}</td><td>${esc(r.views)}</td><td>${esc(r.sales)}</td><td>${esc(r.conversion)}</td></tr>`).join("")}</table>
        </div>`).join("");
}

async function showPolicies() {
    const d = await api("/ebay/shipping-policies");
    panel.innerHTML = errorsBox(d.errors) + d.accounts.map(a => `
        <div class="bg-white border border-slate-200 rounded-xl p-3 text-sm space-y-2">
            <h3 class="font-bold">${esc(a.account)}</h3>
            ${a.policies.map(p => `<div><b>${esc(p.name)}</b> · Bearbeitung ${esc(p.handling_days)} Tag(e)<br>
                ${p.services.map(s => `${esc(s.service)} – ${s.free ? "kostenlos" : esc(s.cost) + " €"}`).join("<br>")}</div>`).join("")}
        </div>`).join("");
}

const TABS = { messages: showMessages, cases: showCases, traffic: showTraffic, policies: showPolicies };
async function open(tab) {
    document.querySelectorAll(".tab").forEach(b => {
        const on = b.dataset.tab === tab;
        b.className = "tab px-3 py-2 rounded " + (on ? "bg-red-600 text-white" : "bg-white border border-slate-300");
    });
    panel.innerHTML = "<p class='text-slate-400'>Lade…</p>";
    document.getElementById("banner").className = "hidden";
    try { await TABS[tab](); } catch (e) { panel.innerHTML = ""; banner(e.message, true); }
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => open(b.dataset.tab));
open("messages");
</script>
</body>
</html>
