<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — Express Print SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <nav class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-10">
        <div class="flex items-center justify-between">
            <h1 class="text-lg font-bold">Versandzentrale</h1>
            <div class="hidden md:flex items-center gap-6">
                <a href="products.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Produkte</a>
                <a href="orders.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Bestellungen</a>
                <a href="expenses.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Ausgaben</a>
                <a href="market-research.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Marktrecherche</a>
                <a href="print-agents.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Print-Agents</a>
                <a href="settings.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Einstellungen</a>
                <button onclick="logout()" class="text-slate-500 hover:text-slate-900 text-sm transition">Abmelden</button>
            </div>
            <button onclick="toggleMobileMenu()" class="md:hidden p-2 -mr-2 text-slate-600" aria-label="Menü öffnen">
                <svg id="menu-icon-open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                <svg id="menu-icon-close" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
            </button>
        </div>
        <div id="mobile-menu" class="hidden md:hidden flex flex-col gap-1 mt-4">
            <a href="products.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Produkte</a>
            <a href="orders.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Bestellungen</a>
            <a href="expenses.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Ausgaben</a>
            <a href="market-research.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Marktrecherche</a>
            <a href="print-agents.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Print-Agents</a>
            <a href="settings.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Einstellungen</a>
            <button onclick="logout()" class="text-left px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Abmelden</button>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto p-6 space-y-6">
        <div id="banner" class="hidden p-3 rounded text-sm text-center"></div>

        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
                <p class="text-slate-500 text-xs mb-1">Bestellungen heute</p>
                <p class="text-2xl font-bold" id="summary-orders-today">—</p>
            </div>
            <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
                <p class="text-slate-500 text-xs mb-1">Gewinn heute</p>
                <p class="text-2xl font-bold text-emerald-600" id="summary-profit-today">—</p>
            </div>
            <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
                <p class="text-slate-500 text-xs mb-1">Bestellungen diesen Monat</p>
                <p class="text-2xl font-bold" id="summary-orders-month">—</p>
            </div>
            <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
                <p class="text-slate-500 text-xs mb-1">Gewinn diesen Monat</p>
                <p class="text-2xl font-bold text-emerald-600" id="summary-profit-month">—</p>
            </div>
        </div>

        <div class="bg-white border border-slate-200 p-6 rounded-xl shadow-sm">
            <h2 class="text-xl font-bold mb-2">eBay-Konto</h2>
            <p class="text-slate-500 text-sm mb-4" id="ebay-desc">Status wird geladen...</p>

            <button id="ebay-connect-btn" onclick="connectEbay()"
                    class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition hidden">
                Mit eBay verbinden
            </button>
            <button id="ebay-disconnect-btn" onclick="disconnectEbay()"
                    class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 px-4 rounded transition hidden">
                eBay-Verbindung trennen
            </button>
        </div>
    </main>

    <script>
        const API_URL = "https://express-print-saas.onrender.com";
        const token = localStorage.getItem("access_token");

        if (!token) {
            window.location.href = "../login.html";
        }

        function authHeaders() {
            return { "Authorization": `Bearer ${token}` };
        }


        function toggleMobileMenu() {
            document.getElementById("mobile-menu").classList.toggle("hidden");
            document.getElementById("menu-icon-open").classList.toggle("hidden");
            document.getElementById("menu-icon-close").classList.toggle("hidden");
        }


        async function injectAdminLink() {
            try {
                const response = await fetch(`${API_URL}/auth/me`, { headers: authHeaders() });
                if (!response.ok) return;
                const me = await response.json();
                if (!me.is_superadmin) return;

                const desktopLogout = document.querySelector('nav .hidden.md\\:flex button[onclick="logout()"]');
                const mobileLogout = document.querySelector('#mobile-menu button[onclick="logout()"]');
                if (desktopLogout) desktopLogout.insertAdjacentHTML("beforebegin", '<a href="admin.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Admin</a>');
                if (mobileLogout) mobileLogout.insertAdjacentHTML("beforebegin", '<a href="admin.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Admin</a>');
            } catch (err) {
                // Non-critical - regular tenants simply never see this link.
            }
        }
        injectAdminLink();

        function logout() {
            localStorage.removeItem("access_token");
            window.location.href = "../login.html";
        }

        function showBanner(text, isError) {
            const banner = document.getElementById("banner");
            banner.innerText = text;
            banner.className = `p-3 rounded text-sm text-center ${isError ? "bg-red-50 text-red-700 border border-red-200" : "bg-emerald-50 text-emerald-700 border border-emerald-200"}`;
        }

        // Show the eBay connect/disconnect result the browser was just redirected back with.
        const params = new URLSearchParams(window.location.search);
        if (params.get("ebay_connected")) {
            showBanner("eBay-Konto erfolgreich verbunden!", false);
        } else if (params.get("ebay_error")) {
            showBanner(`Fehler bei der eBay-Verbindung: ${params.get("ebay_error")}`, true);
        }

        async function loadEbayStatus() {
            const descEl = document.getElementById("ebay-desc");
            const connectBtn = document.getElementById("ebay-connect-btn");
            const disconnectBtn = document.getElementById("ebay-disconnect-btn");

            try {
                const response = await fetch(`${API_URL}/ebay/status`, { headers: authHeaders() });

                if (response.status === 401) {
                    logout();
                    return;
                }

                const data = await response.json();

                if (data) {
                    descEl.innerText = `Verbunden als ${data.ebay_username || "eBay-Verkäufer"}.`;
                    disconnectBtn.classList.remove("hidden");
                } else {
                    descEl.innerText = "Noch kein eBay-Konto verbunden.";
                    connectBtn.classList.remove("hidden");
                }
            } catch (err) {
                descEl.innerText = "Server nicht erreichbar. Bitte Seite neu laden.";
            }
        }

        async function connectEbay() {
            try {
                const response = await fetch(`${API_URL}/ebay/authorize-url`, { headers: authHeaders() });
                const data = await response.json();
                window.location.href = data.authorize_url;
            } catch (err) {
                showBanner("Verbindung zu eBay konnte nicht gestartet werden.", true);
            }
        }

        async function disconnectEbay() {
            try {
                await fetch(`${API_URL}/ebay/disconnect`, { method: "POST", headers: authHeaders() });
                window.location.reload();
            } catch (err) {
                showBanner("Trennen der eBay-Verbindung fehlgeschlagen.", true);
            }
        }

        function euro(value) {
            return value === null || value === undefined ? "—" : `${Number(value).toFixed(2)} €`;
        }

        async function loadSummary() {
            try {
                const response = await fetch(`${API_URL}/orders/summary`, { headers: authHeaders() });
                if (response.status === 401) { logout(); return; }
                const data = await response.json();
                document.getElementById("summary-orders-today").innerText = data.orders_today;
                document.getElementById("summary-profit-today").innerText = euro(data.profit_today);
                document.getElementById("summary-orders-month").innerText = data.orders_month;
                document.getElementById("summary-profit-month").innerText = euro(data.profit_month);
            } catch (err) {
                // Summary is a nice-to-have on this page; a failed fetch here
                // shouldn't block the eBay section below, so just leave the
                // "—" placeholders instead of showing an error banner.
            }
        }

        loadEbayStatus();
        loadSummary();
    </script>
</body>
</html>
