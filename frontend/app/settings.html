<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Einstellungen — Express Print SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="trial-guard.js"></script>
    <script src="../site-logo.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <nav class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-10">
        <div class="flex items-center justify-between">
            <a href="dashboard.html" class="flex items-center gap-2">
                <svg class="brand-logo" width="22" height="22" viewBox="0 0 32 32" fill="none">
                    <rect width="32" height="32" rx="9" fill="#E11D48"/>
                    <path d="M9 21V11h6a4 4 0 0 1 0 8h-3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h1 class="text-lg font-bold">Versandzentrale</h1>
            </a>
            <div class="hidden md:flex items-center gap-6">
                <a href="dashboard.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Dashboard</a>
                <a href="products.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Produkte</a>
                <a href="orders.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Bestellungen</a>
                <a href="expenses.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Ausgaben</a>
                <a href="market-research.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Marktrecherche</a>
                <a href="print-agents.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Print-Agents</a>
                <a href="settings.html" class="text-red-600 text-sm font-semibold">Einstellungen</a>
                <button onclick="logout()" class="text-slate-500 hover:text-slate-900 text-sm transition">Abmelden</button>
            </div>
            <button onclick="toggleMobileMenu()" class="md:hidden p-2 -mr-2 text-slate-600" aria-label="Menü öffnen">
                <svg id="menu-icon-open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                <svg id="menu-icon-close" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
            </button>
        </div>
        <div id="mobile-menu" class="hidden md:hidden flex flex-col gap-1 mt-4">
            <a href="dashboard.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Dashboard</a>
            <a href="products.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Produkte</a>
            <a href="orders.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Bestellungen</a>
            <a href="expenses.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Ausgaben</a>
            <a href="market-research.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Marktrecherche</a>
            <a href="print-agents.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Print-Agents</a>
            <a href="settings.html" class="block px-3 py-2.5 rounded-lg bg-red-50 text-red-600 text-sm font-semibold">Einstellungen</a>
            <button onclick="logout()" class="text-left px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Abmelden</button>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto p-6 space-y-6">
        <div id="banner" class="hidden p-3 rounded text-sm text-center"></div>

        <h2 class="text-2xl font-bold">Einstellungen</h2>

        <!-- Company info -->
        <div class="bg-white border border-slate-200 p-6 rounded-xl shadow-sm space-y-4">
            <h3 class="text-lg font-bold">Unternehmen</h3>
            <div>
                <label class="block text-sm mb-1">Firmenname</label>
                <input type="text" id="field-company-name"
                       class="w-full p-2 rounded bg-white border border-slate-300 text-slate-900 focus:border-red-500 focus:ring-2 focus:ring-red-500/20 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm mb-1">Land (Ländercode, z.B. DE, AT, CH)</label>
                <input type="text" id="field-country" maxlength="2"
                       class="w-24 p-2 rounded bg-white border border-slate-300 text-slate-900 focus:border-red-500 focus:ring-2 focus:ring-red-500/20 focus:outline-none uppercase">
            </div>
            <div id="company-error" class="hidden bg-red-50 text-red-700 border border-red-200 p-2 rounded-lg text-sm"></div>
            <button onclick="saveCompany()"
                    class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition">
                Speichern
            </button>
        </div>

        <!-- Account / login email -->
        <div class="bg-white border border-slate-200 p-6 rounded-xl shadow-sm space-y-4">
            <h3 class="text-lg font-bold">Konto</h3>
            <div>
                <label class="block text-sm mb-1">E-Mail (zum Anmelden)</label>
                <input type="email" id="field-email"
                       class="w-full p-2 rounded bg-white border border-slate-300 text-slate-900 focus:border-red-500 focus:ring-2 focus:ring-red-500/20 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm mb-1">Aktuelles Passwort (zur Bestätigung)</label>
                <input type="password" id="field-email-password" autocomplete="current-password"
                       class="w-full p-2 rounded bg-white border border-slate-300 text-slate-900 focus:border-red-500 focus:ring-2 focus:ring-red-500/20 focus:outline-none">
            </div>
            <div id="email-error" class="hidden bg-red-50 text-red-700 border border-red-200 p-2 rounded-lg text-sm"></div>
            <button onclick="saveEmail()"
                    class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition">
                E-Mail ändern
            </button>
        </div>

        <!-- Print mode -->
        <div class="bg-white border border-slate-200 p-6 rounded-xl shadow-sm space-y-4">
            <h3 class="text-lg font-bold">Druckmodus</h3>
            <p class="text-slate-500 text-sm">
                Bestimmt, wie Versandetiketten für neue Bestellungen gedruckt werden.
            </p>

            <label class="flex items-start gap-3 p-3 rounded border border-slate-200 hover:border-red-300 hover:bg-red-50/30 cursor-pointer transition">
                <input type="radio" name="print-mode" value="DASHBOARD_MANUAL" class="mt-1">
                <span>
                    <span class="font-semibold">Manuell im Dashboard</span>
                    <span class="block text-slate-500 text-sm">Du klickst pro Bestellung selbst auf "Etikett drucken" (aktuell die einzige vollständig funktionierende Option).</span>
                </span>
            </label>

            <label class="flex items-start gap-3 p-3 rounded border border-slate-200 hover:border-red-300 hover:bg-red-50/30 cursor-pointer transition">
                <input type="radio" name="print-mode" value="INSTANT" class="mt-1">
                <span>
                    <span class="font-semibold">Sofort automatisch</span>
                    <span class="block text-slate-500 text-sm">Etiketten sollen sofort bei Eingang einer Bestellung gedruckt werden.</span>
                    <span class="block text-amber-600 text-xs mt-1">⚠ Hinweis: Diese Automatik ist im Backend noch nicht umgesetzt. Bestellungen müssen aktuell auch in diesem Modus manuell über "Etikett drucken" ausgelöst werden.</span>
                </span>
            </label>

            <label class="flex items-start gap-3 p-3 rounded border border-slate-200 hover:border-red-300 hover:bg-red-50/30 cursor-pointer transition">
                <input type="radio" name="print-mode" value="INTEGRATED" class="mt-1">
                <span>
                    <span class="font-semibold">Kombiniert (Etikett + Kommissionierzettel)</span>
                    <span class="block text-slate-500 text-sm">Ein PDF aus Versandetikett und Kommissionierzettel (Produktfoto, Name, Lagerplatz).</span>
                    <span class="block text-amber-600 text-xs mt-1">⚠ Hinweis: Diese PDF-Zusammenführung ist noch nicht gebaut. Solange dieser Modus aktiv ist, lehnt "Etikett drucken" jeden Druckversuch ab.</span>
                </span>
            </label>

            <div id="mode-error" class="hidden bg-red-50 text-red-700 border border-red-200 p-2 rounded-lg text-sm"></div>
            <button onclick="savePrintMode()"
                    class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition">
                Druckmodus speichern
            </button>
        </div>
    </main>

    <script>
        const API_URL = "https://express-print-saas.onrender.com";
        const token = localStorage.getItem("access_token");

        if (!token) {
            window.location.href = "../login.html";
        }

        function authHeaders(json = false) {
            const headers = { "Authorization": `Bearer ${token}` };
            if (json) headers["Content-Type"] = "application/json";
            return headers;
        }


        function toggleMobileMenu() {
            document.getElementById("mobile-menu").classList.toggle("hidden");
            document.getElementById("menu-icon-open").classList.toggle("hidden");
            document.getElementById("menu-icon-close").classList.toggle("hidden");
        }


        async function injectAdminLink() {
            try {
                const response = await fetch(`${API_URL}/auth/me`, { headers: authHeaders() });
                if (!response.ok) return;
                const me = await response.json();
                if (!me.is_superadmin) return;

                const desktopLogout = document.querySelector('nav .hidden.md\\:flex button[onclick="logout()"]');
                const mobileLogout = document.querySelector('#mobile-menu button[onclick="logout()"]');
                if (desktopLogout) desktopLogout.insertAdjacentHTML("beforebegin", '<a href="admin.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Admin</a>');
                if (mobileLogout) mobileLogout.insertAdjacentHTML("beforebegin", '<a href="admin.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Admin</a>');
            } catch (err) {
                // Non-critical - regular tenants simply never see this link.
            }
        }
        injectAdminLink();

        function logout() {
            localStorage.removeItem("access_token");
            window.location.href = "../login.html";
        }

        function showBanner(text, isError) {
            const banner = document.getElementById("banner");
            banner.innerText = text;
            banner.className = `p-3 rounded text-sm text-center ${isError ? "bg-red-50 text-red-700 border border-red-200" : "bg-emerald-50 text-emerald-700 border border-emerald-200"}`;
            setTimeout(() => banner.classList.add("hidden"), 4000);
        }

        async function loadTenant() {
            try {
                const response = await fetch(`${API_URL}/tenants/me`, { headers: authHeaders() });
                if (response.status === 401) { logout(); return; }
                const data = await response.json();

                document.getElementById("field-company-name").value = data.company_name || "";
                document.getElementById("field-country").value = data.country_code || "";

                const radio = document.querySelector(`input[name="print-mode"][value="${data.print_mode}"]`);
                if (radio) radio.checked = true;
            } catch (err) {
                showBanner("Einstellungen konnten nicht geladen werden. Bitte Seite neu laden.", true);
            }
        }

        async function loadAccount() {
            try {
                const response = await fetch(`${API_URL}/auth/me`, { headers: authHeaders() });
                if (response.status === 401) { logout(); return; }
                const data = await response.json();
                document.getElementById("field-email").value = data.email || "";
            } catch (err) {
                // Non-critical - the field just starts empty if this fails.
            }
        }

        async function saveEmail() {
            const errorBox = document.getElementById("email-error");
            errorBox.classList.add("hidden");

            const email = document.getElementById("field-email").value.trim();
            const password = document.getElementById("field-email-password").value;

            if (!email || !password) {
                errorBox.innerText = "Bitte E-Mail und aktuelles Passwort eingeben.";
                errorBox.classList.remove("hidden");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/me/email`, {
                    method: "PATCH",
                    headers: authHeaders(true),
                    body: JSON.stringify({ email, current_password: password }),
                });

                if (response.status === 401) {
                    errorBox.innerText = "Passwort ist falsch.";
                    errorBox.classList.remove("hidden");
                    return;
                }

                const data = await response.json();

                if (!response.ok) {
                    errorBox.innerText = data.detail || "Ändern fehlgeschlagen.";
                    errorBox.classList.remove("hidden");
                    return;
                }

                document.getElementById("field-email-password").value = "";
                showBanner("E-Mail-Adresse geändert. Bitte merke sie dir für die nächste Anmeldung.", false);
            } catch (err) {
                errorBox.innerText = "Server nicht erreichbar. Bitte erneut versuchen.";
                errorBox.classList.remove("hidden");
            }
        }

        async function saveCompany() {
            const errorBox = document.getElementById("company-error");
            errorBox.classList.add("hidden");

            const companyName = document.getElementById("field-company-name").value.trim();
            const countryCode = document.getElementById("field-country").value.trim().toUpperCase();

            if (!companyName) {
                errorBox.innerText = "Bitte einen Firmennamen eingeben.";
                errorBox.classList.remove("hidden");
                return;
            }
            if (countryCode.length !== 2) {
                errorBox.innerText = "Bitte einen zweistelligen Ländercode eingeben (z.B. DE).";
                errorBox.classList.remove("hidden");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/tenants/me`, {
                    method: "PATCH",
                    headers: authHeaders(true),
                    body: JSON.stringify({ company_name: companyName, country_code: countryCode }),
                });

                if (response.status === 401) { logout(); return; }

                const data = await response.json();

                if (!response.ok) {
                    errorBox.innerText = data.detail || "Speichern fehlgeschlagen.";
                    errorBox.classList.remove("hidden");
                    return;
                }

                showBanner("Unternehmensdaten gespeichert.", false);
            } catch (err) {
                errorBox.innerText = "Server nicht erreichbar. Bitte erneut versuchen.";
                errorBox.classList.remove("hidden");
            }
        }

        async function savePrintMode() {
            const errorBox = document.getElementById("mode-error");
            errorBox.classList.add("hidden");

            const selected = document.querySelector('input[name="print-mode"]:checked');
            if (!selected) {
                errorBox.innerText = "Bitte einen Druckmodus auswählen.";
                errorBox.classList.remove("hidden");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/tenants/me/print-mode`, {
                    method: "PATCH",
                    headers: authHeaders(true),
                    body: JSON.stringify({ print_mode: selected.value }),
                });

                if (response.status === 401) { logout(); return; }

                const data = await response.json();

                if (!response.ok) {
                    errorBox.innerText = data.detail || "Speichern fehlgeschlagen.";
                    errorBox.classList.remove("hidden");
                    return;
                }

                showBanner("Druckmodus gespeichert.", false);
            } catch (err) {
                errorBox.innerText = "Server nicht erreichbar. Bitte erneut versuchen.";
                errorBox.classList.remove("hidden");
            }
        }

        loadTenant();
        loadAccount();
    </script>
</body>
</html>
