    <script>
        const API_URL = "https://express-print-saas.onrender.com";
        const token = localStorage.getItem("access_token");

        if (!token) {
            window.location.href = "../login.html";
        }

        let allProducts = [];
        let itemRowCount = 0;

        function authHeaders(json = false) {
            const headers = { "Authorization": `Bearer ${token}` };
            if (json) headers["Content-Type"] = "application/json";
            return headers;
        }


        function toggleMobileMenu() {
            document.getElementById("mobile-menu").classList.toggle("hidden");
            document.getElementById("menu-icon-open").classList.toggle("hidden");
            document.getElementById("menu-icon-close").classList.toggle("hidden");
        }


        function applySidebarProfile(me) {
            const nameEl = document.getElementById("sidebar-user-name");
            const emailEl = document.getElementById("sidebar-user-email");
            const avatarImg = document.getElementById("sidebar-avatar-img");
            const avatarInitial = document.getElementById("sidebar-avatar-initial");
            if (nameEl) nameEl.innerText = me.full_name || me.email;
            if (emailEl) emailEl.innerText = me.email;
            if (me.avatar_url) {
                avatarImg.src = me.avatar_url;
                avatarImg.classList.remove("hidden");
                avatarInitial.classList.add("hidden");
            } else {
                avatarInitial.innerText = (me.full_name || me.email || "?").trim().charAt(0).toUpperCase();
            }
        }

        async function loadSidebarProfile() {
            try {
                const response = await fetch(`${API_URL}/auth/me`, { headers: authHeaders() });
                if (!response.ok) return;
                const me = await response.json();
                applySidebarProfile(me);
                if (!me.is_superadmin) return;

                const desktopLogout = document.querySelector('aside button[onclick="logout()"]');
                const mobileLogout = document.querySelector('#mobile-menu button[onclick="logout()"]');
                if (desktopLogout) desktopLogout.insertAdjacentHTML("beforebegin", '<a href="admin.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 hover:text-red-600 transition"> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg> <span data-i18n="nav.admin">Admin</span> </a>');
                if (mobileLogout) mobileLogout.insertAdjacentHTML("beforebegin", '<a href="admin.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 transition"> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg> <span data-i18n="nav.admin">Admin</span> </a>');
            } catch (err) {
                // Non-critical - sidebar profile info and the admin link just don't show.
            }
        }
        loadSidebarProfile();

        function logout() {
            localStorage.removeItem("access_token");
            window.location.href = "../login.html";
        }

        function showBanner(text, isError) {
            const banner = document.getElementById("banner");
            banner.innerText = text;
            banner.className = `p-3 rounded text-sm text-center ${isError ? "bg-red-50 text-red-700 border border-red-200" : "bg-emerald-50 text-emerald-700 border border-emerald-200"}`;
            setTimeout(() => banner.classList.add("hidden"), 6000);
        }

        function euro(value) {
            return value === null || value === undefined ? "—" : `${Number(value).toFixed(2)} €`;
        }

        function statusLabel(status) {
            const map = {
                new: t("orders.statusNew"),
                ready_to_print: t("orders.statusReadyToPrint"),
                printed: t("orders.statusPrinted"),
                shipped: t("orders.statusShipped"),
                canceled: t("orders.statusCanceled"),
            };
            return map[status] || status;
        }

        async function syncEbayOrders() {
            const btn = document.getElementById("sync-btn");
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = t("orders.syncing");

            try {
                const response = await fetch(`${API_URL}/ebay/sync-orders`, {
                    method: "POST",
                    headers: authHeaders(),
                });

                if (response.status === 401) { logout(); return; }

                const data = await response.json();

                if (!response.ok) {
                    showBanner(data.detail || t("orders.syncFailed"), true);
                    return;
                }

                let message = `${data.created} ${t("orders.syncImported")}`;
                if (data.skipped > 0) {
                    message += ` ${data.skipped} ${t("orders.syncSkipped")}`;
                }
                showBanner(message, data.skipped > 0 && data.created === 0);

                if (data.skipped_reasons && data.skipped_reasons.length > 0) {
                    console.warn("eBay Sync - übersprungene Bestellungen:", data.skipped_reasons);
                }

                loadOrders();
            } catch (err) {
                showBanner(t("orders.serverErrorRetry"), true);
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        function addItemRow() {
            itemRowCount++;
            const id = itemRowCount;
            const container = document.getElementById("items-container");

            const options = allProducts
                .map(p => `<option value="${p.id}">${p.title} (${p.sku})${p.selling_price !== null ? " — " + euro(p.selling_price) : ""}</option>`)
                .join("");

            const row = document.createElement("div");
            row.id = `item-row-${id}`;
            row.className = "flex gap-3 items-center";
            row.innerHTML = `
                <select class="item-product flex-1 p-2 rounded bg-white border border-slate-300 text-slate-900 focus:border-red-500 focus:ring-2 focus:ring-red-500/20 focus:outline-none">
                    <option value="">${t("orders.chooseProduct")}</option>
                    ${options}
                </select>
                <input type="number" class="item-quantity w-24 p-2 rounded bg-white border border-slate-300 text-slate-900 focus:border-red-500 focus:ring-2 focus:ring-red-500/20 focus:outline-none" value="1" min="1" step="1">
                <button type="button" onclick="document.getElementById('item-row-${id}').remove()"
                        class="text-red-600 hover:text-red-700 text-sm">${t("orders.remove")}</button>
            `;
            container.appendChild(row);
        }

        async function openForm() {
            document.getElementById("form-panel").classList.remove("hidden");
            document.getElementById("form-error").classList.add("hidden");
            document.getElementById("field-ref").value = "";
            document.getElementById("items-container").innerHTML = "";
            itemRowCount = 0;

            if (allProducts.length === 0) {
                await loadProductsForSelect();
            }

            if (allProducts.length === 0) {
                showBanner(t("orders.needProductFirst"), true);
                closeForm();
                return;
            }

            addItemRow();
            document.getElementById("form-panel").scrollIntoView({ behavior: "smooth" });
        }

        function closeForm() {
            document.getElementById("form-panel").classList.add("hidden");
        }

        async function loadProductsForSelect() {
            try {
                const response = await fetch(`${API_URL}/products?active=true`, { headers: authHeaders() });
                if (response.status === 401) { logout(); return; }
                allProducts = await response.json();
            } catch (err) {
                showBanner(t("orders.productsLoadError"), true);
            }
        }

        async function saveOrder() {
            const errorBox = document.getElementById("form-error");
            errorBox.classList.add("hidden");

            const rows = document.querySelectorAll("#items-container > div");
            const items = [];
            for (const row of rows) {
                const productId = row.querySelector(".item-product").value;
                const quantity = Number(row.querySelector(".item-quantity").value);
                if (!productId) continue;
                items.push({ product_id: productId, quantity: quantity || 1 });
            }

            if (items.length === 0) {
                errorBox.innerText = t("orders.needItem");
                errorBox.classList.remove("hidden");
                return;
            }

            const payload = {
                external_order_ref: document.getElementById("field-ref").value.trim() || null,
                items,
            };

            try {
                const response = await fetch(`${API_URL}/orders`, {
                    method: "POST",
                    headers: authHeaders(true),
                    body: JSON.stringify(payload),
                });

                if (response.status === 401) { logout(); return; }

                const data = await response.json();

                if (!response.ok) {
                    errorBox.innerText = data.detail || t("orders.createFailed");
                    errorBox.classList.remove("hidden");
                    return;
                }

                closeForm();
                showBanner(t("orders.created"), false);
                loadOrders();
            } catch (err) {
                errorBox.innerText = t("orders.serverErrorRetry");
                errorBox.classList.remove("hidden");
            }
        }

        async function printOrder(orderId) {
            try {
                const response = await fetch(`${API_URL}/print-jobs/order/${orderId}`, {
                    method: "POST",
                    headers: authHeaders(),
                });

                if (response.status === 401) { logout(); return; }

                const data = await response.json();

                if (!response.ok) {
                    showBanner(data.detail || t("orders.printFailed"), true);
                    return;
                }

                showBanner(t("orders.printSent"), false);
                loadOrders();
            } catch (err) {
                showBanner(t("orders.serverErrorRetry"), true);
            }
        }

        function formatRecipientAddress(addr) {
            const line1 = [addr.name].filter(Boolean).join(", ");
            const line2 = [addr.street1, addr.street2].filter(Boolean).join(" ");
            const line3 = [addr.zip, addr.city].filter(Boolean).join(" ");
            const line4 = addr.country_code || "";
            return [line1, line2, line3, line4].filter(Boolean).join(", ");
        }

        function renderOrders(orders) {
            const list = document.getElementById("orders-list");
            const emptyState = document.getElementById("empty-state");

            if (orders.length === 0) {
                emptyState.classList.remove("hidden");
                list.innerHTML = "";
                return;
            }
            emptyState.classList.add("hidden");

            list.innerHTML = orders.map(order => {
                const total = order.items.reduce((sum, i) => sum + (Number(i.unit_price || 0) * i.quantity), 0);
                const itemsHtml = order.items.map(item => `
                    <tr class="border-b border-slate-200">
                        <td class="p-3">
                            ${item.image_url
                                ? `<img src="${item.image_url}" class="w-8 h-8 object-cover rounded" onerror="this.style.display='none'">`
                                : `<div class="w-8 h-8 bg-slate-100 rounded"></div>`}
                        </td>
                        <td class="p-3">${item.product_title}</td>
                        <td class="p-3 text-slate-500">${item.shelf_location || "—"}</td>
                        <td class="p-3">${item.quantity}</td>
                        <td class="p-3">${euro(item.unit_price)}</td>
                        <td class="p-3 ${item.profit >= 0 ? "text-emerald-600" : "text-red-600"}">${euro(item.profit)}</td>
                    </tr>
                `).join("");

                return `
                    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                        <div class="p-4 flex items-center justify-between bg-slate-50 border-b border-slate-200">
                            <div>
                                <span class="font-semibold">${order.external_order_ref || t("orders.noReference")}</span>
                                <span class="ml-3 px-2 py-1 rounded text-xs bg-slate-100 text-slate-600">${statusLabel(order.status)}</span>
                                ${order.status !== "shipped" && order.status !== "canceled" ? `
                                    <button onclick='printOrder(${JSON.stringify(order.id)})'
                                            class="ml-3 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold py-1 px-3 rounded transition">
                                        ${order.status === "new" ? t("orders.printLabel") : t("orders.printAgain")}
                                    </button>
                                ` : ""}
                            </div>
                            <div class="text-right">
                                <div class="text-red-600 font-bold">${euro(total)}</div>
                                <div class="text-xs ${order.total_profit >= 0 ? "text-emerald-600" : "text-red-600"}">${t("orders.profit")} ${euro(order.total_profit)}</div>
                            </div>
                        </div>
                        ${order.recipient_address ? `
                            <div class="px-4 py-2 text-xs text-slate-500 border-b border-slate-200 bg-slate-50/50">
                                ${t("orders.shipTo")} ${formatRecipientAddress(order.recipient_address)}
                            </div>
                        ` : ""}
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="text-left text-slate-400 text-xs border-b border-slate-200">
                                    <th class="p-3"></th>
                                    <th class="p-3">${t("orders.colProduct")}</th>
                                    <th class="p-3">${t("orders.colShelf")}</th>
                                    <th class="p-3">${t("orders.colQuantity")}</th>
                                    <th class="p-3">${t("orders.colPrice")}</th>
                                    <th class="p-3">${t("orders.colProfit")}</th>
                                </tr>
                            </thead>
                            <tbody>${itemsHtml}</tbody>
                        </table>
                    </div>
                `;
            }).join("");
        }

        async function loadOrders() {
            try {
                const response = await fetch(`${API_URL}/orders`, { headers: authHeaders() });
                if (response.status === 401) { logout(); return; }
                const data = await response.json();
                renderOrders(data);
            } catch (err) {
                showBanner(t("orders.serverErrorReload"), true);
            }
        }

        loadOrders();
        document.addEventListener("langchange", loadOrders);
    </script>
</body>
</html>
