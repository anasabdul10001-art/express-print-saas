<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestellungen — Express Print SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="trial-guard.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <nav class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-10">
        <div class="flex items-center justify-between">
            <h1 class="text-lg font-bold">Versandzentrale</h1>
            <div class="hidden md:flex items-center gap-6">
                <a href="../app/dashboard.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Dashboard</a>
                <a href="products.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Produkte</a>
                <a href="expenses.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Ausgaben</a>
                <a href="market-research.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Marktrecherche</a>
                <a href="print-agents.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Print-Agents</a>
                <a href="settings.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Einstellungen</a>
                <button onclick="logout()" class="text-slate-500 hover:text-slate-900 text-sm transition">Abmelden</button>
            </div>
            <button onclick="toggleMobileMenu()" class="md:hidden p-2 -mr-2 text-slate-600" aria-label="Menü öffnen">
                <svg id="menu-icon-open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                <svg id="menu-icon-close" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
            </button>
        </div>
        <div id="mobile-menu" class="hidden md:hidden flex flex-col gap-1 mt-4">
            <a href="../app/dashboard.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Dashboard</a>
            <a href="products.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Produkte</a>
            <a href="expenses.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Ausgaben</a>
            <a href="market-research.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Marktrecherche</a>
            <a href="print-agents.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Print-Agents</a>
            <a href="settings.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Einstellungen</a>
            <button onclick="logout()" class="text-left px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Abmelden</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6 space-y-6">
        <div id="banner" class="hidden p-3 rounded text-sm text-center"></div>

        <div class="flex items-center justify-between gap-4 flex-wrap">
            <h2 class="text-2xl font-bold">Bestellungen</h2>
            <div class="flex gap-3">
                <button id="sync-btn" onclick="syncEbayOrders()"
                        class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-4 rounded transition">
                    Von eBay synchronisieren
                </button>
                <button onclick="openForm()"
                        class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition">
                    + Neue Bestellung
                </button>
            </div>
        </div>

        <!-- New order form, hidden by default -->
        <div id="form-panel" class="hidden bg-white border border-slate-200 p-6 rounded-xl shadow-sm space-y-4">
            <h3 class="text-lg font-bold">Neue Bestellung</h3>

            <div>
                <label class="block text-sm mb-1">Referenz (optional)</label>
                <input type="text" id="field-ref" placeholder="z.B. eigene Notiz oder Bestellnummer"
                       class="w-full p-2 rounded bg-white border border-slate-300 text-slate-900 focus:border-red-500 focus:ring-2 focus:ring-red-500/20 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm mb-2">Artikel</label>
                <div id="items-container" class="space-y-3"></div>
                <button type="button" onclick="addItemRow()"
                        class="mt-3 text-red-600 hover:text-red-700 text-sm font-semibold">
                    + Artikel hinzufügen
                </button>
            </div>

            <div id="form-error" class="hidden bg-red-50 text-red-700 border border-red-200 p-2 rounded-lg text-sm"></div>

            <div class="flex gap-3">
                <button onclick="saveOrder()"
                        class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition">
                    Bestellung anlegen
                </button>
                <button onclick="closeForm()"
                        class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-4 rounded transition">
                    Abbrechen
                </button>
            </div>
        </div>

        <!-- Empty state -->
        <div id="empty-state" class="hidden bg-white border border-slate-200 p-8 rounded-xl text-center space-y-3">
            <p class="text-slate-500">Noch keine Bestellungen vorhanden.</p>
            <button onclick="openForm()"
                    class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition">
                Erste Bestellung anlegen
            </button>
        </div>

        <!-- Orders list -->
        <div id="orders-list" class="space-y-4"></div>
    </main>

    <script>
        const API_URL = "https://express-print-saas.onrender.com";
        const token = localStorage.getItem("access_token");

        if (!token) {
            window.location.href = "../login.html";
        }

        let allProducts = [];
        let itemRowCount = 0;

        function authHeaders(json = false) {
            const headers = { "Authorization": `Bearer ${token}` };
            if (json) headers["Content-Type"] = "application/json";
            return headers;
        }


        function toggleMobileMenu() {
            document.getElementById("mobile-menu").classList.toggle("hidden");
            document.getElementById("menu-icon-open").classList.toggle("hidden");
            document.getElementById("menu-icon-close").classList.toggle("hidden");
        }


        async function injectAdminLink() {
            try {
                const response = await fetch(`${API_URL}/auth/me`, { headers: authHeaders() });
                if (!response.ok) return;
                const me = await response.json();
                if (!me.is_superadmin) return;

                const desktopLogout = document.querySelector('nav .hidden.md\\:flex button[onclick="logout()"]');
                const mobileLogout = document.querySelector('#mobile-menu button[onclick="logout()"]');
                if (desktopLogout) desktopLogout.insertAdjacentHTML("beforebegin", '<a href="admin.html" class="text-slate-600 hover:text-red-600 text-sm font-semibold transition">Admin</a>');
                if (mobileLogout) mobileLogout.insertAdjacentHTML("beforebegin", '<a href="admin.html" class="block px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">Admin</a>');
            } catch (err) {
                // Non-critical - regular tenants simply never see this link.
            }
        }
        injectAdminLink();

        function logout() {
            localStorage.removeItem("access_token");
            window.location.href = "../login.html";
        }

        function showBanner(text, isError) {
            const banner = document.getElementById("banner");
            banner.innerText = text;
            banner.className = `p-3 rounded text-sm text-center ${isError ? "bg-red-50 text-red-700 border border-red-200" : "bg-emerald-50 text-emerald-700 border border-emerald-200"}`;
            setTimeout(() => banner.classList.add("hidden"), 6000);
        }

        function euro(value) {
            return value === null || value === undefined ? "—" : `${Number(value).toFixed(2)} €`;
        }

        function statusLabel(status) {
            const map = {
                new: "Neu",
                ready_to_print: "Druckbereit",
                printed: "Gedruckt",
                shipped: "Versendet",
                canceled: "Storniert",
            };
            return map[status] || status;
        }

        async function syncEbayOrders() {
            const btn = document.getElementById("sync-btn");
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "Wird synchronisiert...";

            try {
                const response = await fetch(`${API_URL}/ebay/sync-orders`, {
                    method: "POST",
                    headers: authHeaders(),
                });

                if (response.status === 401) { logout(); return; }

                const data = await response.json();

                if (!response.ok) {
                    showBanner(data.detail || "Synchronisierung fehlgeschlagen.", true);
                    return;
                }

                let message = `${data.created} neue Bestellung(en) importiert.`;
                if (data.skipped > 0) {
                    message += ` ${data.skipped} übersprungen.`;
                }
                showBanner(message, data.skipped > 0 && data.created === 0);

                if (data.skipped_reasons && data.skipped_reasons.length > 0) {
                    console.warn("eBay Sync - übersprungene Bestellungen:", data.skipped_reasons);
                }

                loadOrders();
            } catch (err) {
                showBanner("Server nicht erreichbar. Bitte erneut versuchen.", true);
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        function addItemRow() {
            itemRowCount++;
            const id = itemRowCount;
            const container = document.getElementById("items-container");

            const options = allProducts
                .map(p => `<option value="${p.id}">${p.title} (${p.sku})${p.selling_price !== null ? " — " + euro(p.selling_price) : ""}</option>`)
                .join("");

            const row = document.createElement("div");
            row.id = `item-row-${id}`;
            row.className = "flex gap-3 items-center";
            row.innerHTML = `
                <select class="item-product flex-1 p-2 rounded bg-white border border-slate-300 text-slate-900 focus:border-red-500 focus:ring-2 focus:ring-red-500/20 focus:outline-none">
                    <option value="">Produkt wählen...</option>
                    ${options}
                </select>
                <input type="number" class="item-quantity w-24 p-2 rounded bg-white border border-slate-300 text-slate-900 focus:border-red-500 focus:ring-2 focus:ring-red-500/20 focus:outline-none" value="1" min="1" step="1">
                <button type="button" onclick="document.getElementById('item-row-${id}').remove()"
                        class="text-red-600 hover:text-red-700 text-sm">Entfernen</button>
            `;
            container.appendChild(row);
        }

        async function openForm() {
            document.getElementById("form-panel").classList.remove("hidden");
            document.getElementById("form-error").classList.add("hidden");
            document.getElementById("field-ref").value = "";
            document.getElementById("items-container").innerHTML = "";
            itemRowCount = 0;

            if (allProducts.length === 0) {
                await loadProductsForSelect();
            }

            if (allProducts.length === 0) {
                showBanner("Bitte zuerst mindestens ein Produkt anlegen.", true);
                closeForm();
                return;
            }

            addItemRow();
            document.getElementById("form-panel").scrollIntoView({ behavior: "smooth" });
        }

        function closeForm() {
            document.getElementById("form-panel").classList.add("hidden");
        }

        async function loadProductsForSelect() {
            try {
                const response = await fetch(`${API_URL}/products?active=true`, { headers: authHeaders() });
                if (response.status === 401) { logout(); return; }
                allProducts = await response.json();
            } catch (err) {
                showBanner("Produkte konnten nicht geladen werden.", true);
            }
        }

        async function saveOrder() {
            const errorBox = document.getElementById("form-error");
            errorBox.classList.add("hidden");

            const rows = document.querySelectorAll("#items-container > div");
            const items = [];
            for (const row of rows) {
                const productId = row.querySelector(".item-product").value;
                const quantity = Number(row.querySelector(".item-quantity").value);
                if (!productId) continue;
                items.push({ product_id: productId, quantity: quantity || 1 });
            }

            if (items.length === 0) {
                errorBox.innerText = "Bitte mindestens einen Artikel mit Produkt auswählen.";
                errorBox.classList.remove("hidden");
                return;
            }

            const payload = {
                external_order_ref: document.getElementById("field-ref").value.trim() || null,
                items,
            };

            try {
                const response = await fetch(`${API_URL}/orders`, {
                    method: "POST",
                    headers: authHeaders(true),
                    body: JSON.stringify(payload),
                });

                if (response.status === 401) { logout(); return; }

                const data = await response.json();

                if (!response.ok) {
                    errorBox.innerText = data.detail || "Anlegen fehlgeschlagen.";
                    errorBox.classList.remove("hidden");
                    return;
                }

                closeForm();
                showBanner("Bestellung angelegt.", false);
                loadOrders();
            } catch (err) {
                errorBox.innerText = "Server nicht erreichbar. Bitte erneut versuchen.";
                errorBox.classList.remove("hidden");
            }
        }

        async function printOrder(orderId) {
            try {
                const response = await fetch(`${API_URL}/print-jobs/order/${orderId}`, {
                    method: "POST",
                    headers: authHeaders(),
                });

                if (response.status === 401) { logout(); return; }

                const data = await response.json();

                if (!response.ok) {
                    showBanner(data.detail || "Druckauftrag konnte nicht erstellt werden.", true);
                    return;
                }

                showBanner("Druckauftrag an den Print-Agent gesendet.", false);
                loadOrders();
            } catch (err) {
                showBanner("Server nicht erreichbar. Bitte erneut versuchen.", true);
            }
        }

        function renderOrders(orders) {
            const list = document.getElementById("orders-list");
            const emptyState = document.getElementById("empty-state");

            if (orders.length === 0) {
                emptyState.classList.remove("hidden");
                list.innerHTML = "";
                return;
            }
            emptyState.classList.add("hidden");

            list.innerHTML = orders.map(order => {
                const total = order.items.reduce((sum, i) => sum + (Number(i.unit_price || 0) * i.quantity), 0);
                const itemsHtml = order.items.map(item => `
                    <tr class="border-b border-slate-200">
                        <td class="p-3">
                            ${item.image_url
                                ? `<img src="${item.image_url}" class="w-8 h-8 object-cover rounded" onerror="this.style.display='none'">`
                                : `<div class="w-8 h-8 bg-slate-100 rounded"></div>`}
                        </td>
                        <td class="p-3">${item.product_title}</td>
                        <td class="p-3 text-slate-500">${item.shelf_location || "—"}</td>
                        <td class="p-3">${item.quantity}</td>
                        <td class="p-3">${euro(item.unit_price)}</td>
                        <td class="p-3 ${item.profit >= 0 ? "text-emerald-600" : "text-red-600"}">${euro(item.profit)}</td>
                    </tr>
                `).join("");

                return `
                    <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                        <div class="p-4 flex items-center justify-between bg-slate-50 border-b border-slate-200">
                            <div>
                                <span class="font-semibold">${order.external_order_ref || "Ohne Referenz"}</span>
                                <span class="ml-3 px-2 py-1 rounded text-xs bg-slate-100 text-slate-600">${statusLabel(order.status)}</span>
                                ${order.status !== "shipped" && order.status !== "canceled" ? `
                                    <button onclick='printOrder(${JSON.stringify(order.id)})'
                                            class="ml-3 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold py-1 px-3 rounded transition">
                                        ${order.status === "new" ? "Etikett drucken" : "Erneut drucken"}
                                    </button>
                                ` : ""}
                            </div>
                            <div class="text-right">
                                <div class="text-red-600 font-bold">${euro(total)}</div>
                                <div class="text-xs ${order.total_profit >= 0 ? "text-emerald-600" : "text-red-600"}">Gewinn: ${euro(order.total_profit)}</div>
                            </div>
                        </div>
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="text-left text-slate-400 text-xs border-b border-slate-200">
                                    <th class="p-3"></th>
                                    <th class="p-3">Produkt</th>
                                    <th class="p-3">Regal</th>
                                    <th class="p-3">Menge</th>
                                    <th class="p-3">Preis</th>
                                    <th class="p-3">Gewinn</th>
                                </tr>
                            </thead>
                            <tbody>${itemsHtml}</tbody>
                        </table>
                    </div>
                `;
            }).join("");
        }

        async function loadOrders() {
            try {
                const response = await fetch(`${API_URL}/orders`, { headers: authHeaders() });
                if (response.status === 401) { logout(); return; }
                const data = await response.json();
                renderOrders(data);
            } catch (err) {
                showBanner("Server nicht erreichbar. Bitte Seite neu laden.", true);
            }
        }

        loadOrders();
    </script>
</body>
</html>
