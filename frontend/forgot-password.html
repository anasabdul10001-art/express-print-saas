<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passwort vergessen — Express Print SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-2 text-center">Passwort vergessen</h2>
        <p class="text-gray-400 text-sm text-center mb-6">
            Gib deine E-Mail-Adresse ein. Falls ein Konto existiert, senden wir dir einen Link zum Zurücksetzen.
        </p>

        <div id="error-box" class="hidden bg-red-600 text-white p-3 rounded mb-4 text-center text-sm"></div>
        <div id="success-box" class="hidden bg-green-600 text-white p-3 rounded mb-4 text-center text-sm"></div>

        <form id="forgot-form" onsubmit="handleForgotPassword(event)" class="space-y-4">
            <div>
                <label class="block text-sm mb-1">E-Mail</label>
                <input type="email" id="email" required autocomplete="email"
                       class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white">
            </div>
            <button type="submit" id="submit-btn"
                    class="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-2 rounded transition">
                Link zum Zurücksetzen senden
            </button>
        </form>

        <p class="text-gray-400 text-sm text-center mt-6">
            <a href="login.html" class="text-yellow-500 hover:text-yellow-400 font-semibold">Zurück zur Anmeldung</a>
        </p>
    </div>

    <script>
        const API_URL = "https://express-print-saas.onrender.com";

        async function handleForgotPassword(event) {
            event.preventDefault();
            const errBox = document.getElementById("error-box");
            const succBox = document.getElementById("success-box");
            const btn = document.getElementById("submit-btn");

            errBox.classList.add("hidden");
            succBox.classList.add("hidden");
            btn.disabled = true;
            btn.innerText = "Bitte warten...";

            try {
                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: document.getElementById("email").value })
                });

                const data = await response.json();

                if (response.ok) {
                    succBox.innerText = data.message;
                    succBox.classList.remove("hidden");
                    document.getElementById("forgot-form").reset();
                } else {
                    errBox.innerText = data.detail || "Etwas ist schiefgelaufen. Bitte erneut versuchen.";
                    errBox.classList.remove("hidden");
                }
            } catch (err) {
                errBox.innerText = "Server nicht erreichbar. Bitte 30s warten (Render Free Tier) und erneut versuchen.";
                errBox.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btn.innerText = "Link zum Zurücksetzen senden";
            }
        }
    </script>
</body>
</html>
