<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <title>Passwort festlegen — Partner-Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/nettodesk.js"></script>
    <script src="password-toggle.js" defer></script>
    <script src="site-logo.js"></script>
    <script src="cookie-notice.js"></script>
    <script src="translations.js"></script>
    <script src="i18n.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 flex items-center justify-center min-h-screen p-6">
    <div class="fixed top-4 right-4 flex items-center gap-1 text-xs font-semibold">
        <button type="button" data-lang-btn="de" class="px-1.5 py-1 rounded hover:bg-slate-200 transition">DE</button>
        <span class="text-slate-300">|</span>
        <button type="button" data-lang-btn="en" class="px-1.5 py-1 rounded hover:bg-slate-200 transition">EN</button>
    </div>
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 w-full max-w-md">
        <div class="flex items-center gap-2 justify-center mb-6">
            <img class="brand-logo" src="assets/nettodesk-logo.svg" alt="NettoDesk" style="height:28px;width:auto" />
        </div>

        <h2 class="text-2xl font-bold mb-6 text-center" data-i18n="affiliateSetPassword.title">Passwort festlegen</h2>

        <div id="error-box" class="hidden bg-red-50 text-red-700 border border-red-200 p-3 rounded-lg mb-4 text-center text-sm"></div>
        <div id="success-box" class="hidden bg-emerald-50 text-emerald-700 border border-emerald-200 p-3 rounded-lg mb-4 text-center text-sm"></div>

        <form id="set-password-form" onsubmit="handleSetPassword(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5" data-i18n="affiliateSetPassword.newPassword">Neues Passwort</label>
                <input type="password" id="password" required minlength="8" autocomplete="new-password"
                       class="w-full px-3 py-2.5 rounded-lg bg-white border border-slate-300 text-slate-900 focus:border-brand focus:ring-2 focus:ring-brand/20 focus:outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1.5" data-i18n="affiliateSetPassword.confirmPassword">Passwort bestätigen</label>
                <input type="password" id="password-confirm" required minlength="8" autocomplete="new-password"
                       class="w-full px-3 py-2.5 rounded-lg bg-white border border-slate-300 text-slate-900 focus:border-brand focus:ring-2 focus:ring-brand/20 focus:outline-none transition">
            </div>
            <button type="submit" id="submit-btn"
                    class="w-full bg-brand hover:bg-brand-hover text-ink font-semibold py-2.5 rounded-lg transition shadow-sm shadow-brand/20">
                <span data-i18n="affiliateSetPassword.submit">Passwort speichern</span>
            </button>
        </form>

        <p class="text-slate-500 text-sm text-center mt-6">
            <a href="affiliate-login.html" class="text-brand-deep hover:text-brand-deep font-semibold" data-i18n="affiliateSetPassword.backToLogin">Zurück zur Partner-Anmeldung</a>
        </p>
    </div>

    <script>
        const API_URL = ["localhost", "127.0.0.1"].includes(location.hostname) ? location.origin : "https://express-print-saas.onrender.com";
        const token = new URLSearchParams(window.location.search).get("token");

        if (!token) {
            document.getElementById("set-password-form").classList.add("hidden");
            const errBox = document.getElementById("error-box");
            errBox.innerText = t("affiliateSetPassword.invalidLink");
            errBox.classList.remove("hidden");
        }

        async function handleSetPassword(event) {
            event.preventDefault();
            const errBox = document.getElementById("error-box");
            const succBox = document.getElementById("success-box");
            const btn = document.getElementById("submit-btn");

            errBox.classList.add("hidden");
            succBox.classList.add("hidden");

            const password = document.getElementById("password").value;
            const passwordConfirm = document.getElementById("password-confirm").value;

            if (password !== passwordConfirm) {
                errBox.innerText = t("affiliateSetPassword.mismatch");
                errBox.classList.remove("hidden");
                return;
            }

            btn.disabled = true;
            btn.innerText = t("affiliateSetPassword.submitLoading");

            try {
                const response = await fetch(`${API_URL}/affiliate/set-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, new_password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    succBox.innerText = `${data.message} ${t("affiliateSetPassword.redirecting")}`;
                    succBox.classList.remove("hidden");
                    document.getElementById("set-password-form").classList.add("hidden");
                    setTimeout(() => { window.location.href = "affiliate-login.html"; }, 2000);
                } else {
                    errBox.innerText = data.detail || t("affiliateSetPassword.genericError");
                    errBox.classList.remove("hidden");
                }
            } catch (err) {
                errBox.innerText = t("affiliateSetPassword.serverError");
                errBox.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btn.innerText = t("affiliateSetPassword.submit");
            }
        }
    </script>
</body>
</html>
