<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <title>Hilfe-Center — NettoDesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/nettodesk.js"></script>
    <script src="site-logo.js"></script>
    <script src="page-content.js"></script>
    <script src="cookie-notice.js"></script>
</head>
<body class="bg-white text-slate-900 min-h-screen">
    <nav class="bg-white border-b border-slate-200 px-6 py-4">
        <a href="index.html" class="flex items-center gap-2 w-fit">
            <img class="brand-logo" src="assets/nettodesk-logo.svg" alt="NettoDesk" style="height:26px;width:auto" />
        </a>
    </nav>

    <main class="max-w-3xl mx-auto p-6 py-12 space-y-4 text-slate-600 text-sm leading-relaxed">
        <h1 id="page-title" class="text-3xl font-bold text-slate-900">Wird geladen...</h1>
        <div id="page-content" class="space-y-4 [&_h2]:text-lg [&_h2]:font-bold [&_h2]:text-slate-900 [&_h2]:pt-2 [&_h3]:font-bold [&_h3]:text-slate-900 [&_ul]:list-disc [&_ul]:pl-5 [&_ol]:list-decimal [&_ol]:pl-5"></div>
        <p id="page-error" class="hidden text-red-600">Seite konnte nicht geladen werden. Bitte später erneut versuchen.</p>
    </main>

    <script>
        const API_URL = ["localhost", "127.0.0.1"].includes(location.hostname) ? location.origin : "https://express-print-saas.onrender.com";
        const SLUG = "help";

        function renderContent(text) {
            renderPageContent(document.getElementById("page-content"), text);
        }

        async function loadPage() {
            try {
                const response = await fetch(`${API_URL}/pages/${SLUG}`);
                if (!response.ok) throw new Error("failed");
                const data = await response.json();
                document.getElementById("page-title").innerText = data.title;
                document.title = `${data.title} — NettoDesk`;
                renderContent(data.content);
            } catch (err) {
                document.getElementById("page-title").innerText = "—";
                document.getElementById("page-error").classList.remove("hidden");
            }
        }
        loadPage();
    </script>
</body>
</html>
