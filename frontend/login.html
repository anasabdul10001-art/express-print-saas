<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anmelden — Express Print SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center">Versandzentrale</h2>
        <p class="text-gray-400 text-sm text-center mb-6">Melde dich bei deinem Konto an</p>

        <div id="error-box" class="hidden bg-red-600 text-white p-3 rounded mb-4 text-center text-sm"></div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm mb-1">E-Mail</label>
                <input type="email" id="email" required autocomplete="email"
                       class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white">
            </div>
            <div>
                <label class="block text-sm mb-1">Passwort</label>
                <input type="password" id="password" required autocomplete="current-password"
                       class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white">
            </div>
            <button type="submit" id="submit-btn"
                    class="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-2 rounded transition">
                Anmelden
            </button>
        </form>

        <p class="text-gray-400 text-sm text-center mt-6">
            Noch kein Konto?
            <a href="index.html" class="text-yellow-500 hover:text-yellow-400 font-semibold">Jetzt registrieren</a>
        </p>
    </div>

    <script>
        const API_URL = "https://express-print-saas.onrender.com";

        // Already logged in? Skip straight to the dashboard.
        if (localStorage.getItem("access_token")) {
            window.location.href = "app/dashboard.html";
        }

        async function handleLogin(event) {
            event.preventDefault();
            const errBox = document.getElementById("error-box");
            const btn = document.getElementById("submit-btn");

            errBox.classList.add("hidden");
            btn.disabled = true;
            btn.innerText = "Bitte warten...";

            const payload = {
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            };

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem("access_token", data.access_token);
                    window.location.href = "app/dashboard.html";
                } else {
                    errBox.innerText = data.detail || "E-Mail oder Passwort ist falsch.";
                    errBox.classList.remove("hidden");
                }
            } catch (err) {
                errBox.innerText = "Server nicht erreichbar. Bitte 30s warten (Render Free Tier) und erneut versuchen.";
                errBox.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btn.innerText = "Anmelden";
            }
        }
    </script>
</body>
</html>
