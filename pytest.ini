[pytest]
testpaths = tests
# Without this, running the plain `pytest` command (as opposed to
# `python -m pytest`, which auto-prepends the CWD to sys.path) fails to
# import the `app` package from tests/conftest.py - pytest's own import-
# mode insertion only adds tests/ itself (no __init__.py there), not the
# repo root.
pythonpath = .
