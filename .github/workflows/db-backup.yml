name: Database backup

on:
  schedule:
    # 03:00 UTC every day - low-traffic hours, and a few minutes of GitHub
    # Actions cron lateness doesn't matter for a daily backup.
    - cron: "0 3 * * *"
  workflow_dispatch: {} # lets you trigger a backup manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL 17 client (matches the production server version)
        run: |
          # GitHub's runner image no longer carries this version, so it comes
          # from PostgreSQL's own package repository.
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install httpx

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/backup_database.py
