<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Versandzentrale — Express Print SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center">Versandzentrale</h2>
        
        <div id="error-box" class="hidden bg-red-600 text-white p-3 rounded mb-4 text-center text-sm"></div>
        <div id="success-box" class="hidden bg-green-600 text-white p-3 rounded mb-4 text-center text-sm"></div>

        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
            <div>
                <label class="block text-sm mb-1">Firmenname</label>
                <input type="text" id="company_name" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white">
            </div>
            <div>
                <label class="block text-sm mb-1">E-Mail</label>
                <input type="email" id="email" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white">
            </div>
            <div>
                <label class="block text-sm mb-1">Passwort</label>
                <input type="password" id="password" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 text-white">
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-2 rounded transition">
                Konto erstellen
            </button>
        </form>
    </div>

    <script>
        const API_URL = "https://express-print-saas.onrender.com";

        async function handleAuth(event) {
            event.preventDefault();
            const errBox = document.getElementById("error-box");
            const succBox = document.getElementById("success-box");
            const btn = document.getElementById("submit-btn");

            errBox.classList.add("hidden");
            succBox.classList.add("hidden");
            btn.disabled = true;
            btn.innerText = "Bitte warten...";

            const payload = {
                company_name: document.getElementById("company_name").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            };

            try {
                // تجربة مسار التسجيل الأساسي
                let response = await fetch(`${API_URL}/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                // إذا كان المسار /register بدون /auth
                if (response.status === 404) {
                    response = await fetch(`${API_URL}/register`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                }

                const data = await response.json();

                if (response.ok) {
                    succBox.innerText = "Konto erfolgreich erstellt!";
                    succBox.classList.remove("hidden");
                } else {
                    errBox.innerText = data.detail || "Fehler beim Erstellen des Kontos.";
                    errBox.classList.remove("hidden");
                }
            } catch (err) {
                errBox.innerText = "Server nicht erreichbar. Bitte 30s warten (Render Free Tier).";
                errBox.classList.remove("hidden");
            } finally {
                btn.disabled = false;
                btn.innerText = "Konto erstellen";
            }
        }
    </script>
</body>
</html>
